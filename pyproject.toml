[project]
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "prometheus-client>=0.24.1",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "sqlalchemy[asyncio]>=2.0.52",
]
description = "FastAPI Library project generated using minimal-fastapi-postgres-template."
name = "lib-api"
requires-python = ">=3.14,<3.15"
version = "0.1.0"

[dependency-groups]
dev = [
    "coverage>=7.13.2",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "uvicorn[standard]>=0.40.0",
]

[tool.uv]
package = false

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=100"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
filterwarnings = [""]
testpaths = ["app"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["alembic/*", "app/tests/*", "conftest.py", "test_*.py"]
source = ["app"]

[tool.mypy]
exclude = [".venv", "alembic"]
files = "app/**"
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pylint, pyupgrade
ignore = ["E501"]
select = ["E", "F", "I", "PL", "UP", "W"]
