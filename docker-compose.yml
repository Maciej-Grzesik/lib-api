services:
  postgres_db:
    restart: unless-stopped
    image: postgres:18
    volumes:
      - postgres_db:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DATABASE__DB}
      POSTGRES_USER: ${DATABASE__USERNAME}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
    env_file:
      - .env
    ports:
      - "${DATABASE__PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DATABASE__HOSTNAME: postgres_db
      DATABASE__USERNAME: ${DATABASE__USERNAME}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD}
      DATABASE__PORT: 5432
      DATABASE__DB: ${DATABASE__DB}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/probe/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_db:
